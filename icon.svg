<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="128" height="128" rx="26" fill="url(#bg)"/>

  <!--
    Bold geometric M — path-based so it renders at any size without fonts.
    Two vertical pillars + two diagonals meeting at a V in the centre.
    Designed to be clearly readable at 16×16, 32×32, and 128×128.
  -->
  <path
    d="M18,102
       L18,26
       L36,26
       L64,62
       L92,26
       L110,26
       L110,102
       L92,102
       L92,54
       L72,86
       L56,86
       L36,54
       L36,102
       Z"
    fill="white"
  />

  <!-- AI sparkle — small 4-point star, bottom-right corner -->
  <path
    d="M100,94 L102,88 L104,94 L110,96 L104,98 L102,104 L100,98 L94,96 Z"
    fill="white"
    opacity="0.85"
  />
</svg>
