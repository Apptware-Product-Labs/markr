name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        Please fill in as much detail as you can so we can reproduce it quickly.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "When I open a file with a Mermaid block, the preview shows a blank diagram."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps to trigger the bug.
      placeholder: |
        1. Open VS Code
        2. Open a `.md` file containing a `mermaid` code block
        3. Press Cmd+Shift+M to open Markr
        4. See blank diagram
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: md-sample
    attributes:
      label: Minimal `.md` sample
      description: Paste the smallest `.md` file that reproduces the issue.
      render: markdown

  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
      placeholder: "1.89.0"
    validations:
      required: true

  - type: input
    id: markr-version
    attributes:
      label: Markr version
      placeholder: "3.6.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
